name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # NOT a stray trigger, however much it looks like one. `main` holds two
      # commits — the character glb and the cover image — and no game code
      # whatsoever; the entire project lives on this branch. Deleting this line
      # as tidy-up in the v4 overhaul silently stopped every Pages deploy, and
      # the live site sat on v3 for two releases with nothing failing anywhere
      # to say so. Remove it when main is the branch that has the game on it,
      # and not before.
      - claude/unstable-delivery-game-7v97xz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages was originally enabled with "Deploy from a branch", which
      # publishes the raw source tree and overwrites our artifact deploys.
      # Force the source to "GitHub Actions" so only dist/ gets served.
      - name: Force Pages source to GitHub Actions
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' \
            || echo "::warning::Could not switch Pages build_type via API — set Settings > Pages > Source to 'GitHub Actions' manually"
          echo "Current Pages config:"
          curl -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Assert the live site serves the built game
        run: |
          URL="${{ needs.deploy.outputs.page_url }}"
          echo "Checking $URL"
          for i in $(seq 1 10); do
            HTML=$(curl -sSL --max-time 20 "$URL" || true)
            if echo "$HTML" | grep -q 'assets/index-' && ! echo "$HTML" | grep -q 'src/main.js'; then
              echo "OK: built bundle is being served."
              exit 0
            fi
            echo "Attempt $i: still serving stale/raw content, retrying in 15s…"
            sleep 15
          done
          echo "::error::Live site is not serving the built bundle. Check Settings > Pages > Source = 'GitHub Actions'."
          echo "--- last HTML head ---"
          echo "$HTML" | head -30
          exit 1
