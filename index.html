<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unstable Delivery — VPS Vertical Parcel Service</title>
  <meta name="description" content="Haul absurd cargo up a mountain for a logistics company that should not legally exist. Do not shake the potion." />
  <meta property="og:title" content="Unstable Delivery" />
  <meta property="og:description" content="UPHILL. ON TIME. MOSTLY. A physics delivery game for the Vertical Parcel Service." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./assets/cover.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 40%22><rect width=%2264%22 height=%2240%22 fill=%22%23A83619%22/><g fill=%22%23FFD166%22><path d=%22M2 30 L10 30 L18 14 L10 14 Z%22/><path d=%22M14 30 L22 30 L32 8 L24 8 Z%22/><path d=%22M28 30 L36 30 L48 2 L40 2 Z%22/><rect x=%2244%22 y=%2218%22 width=%2218%22 height=%2216%22/></g></svg>" />
  <style>
    /* Critical shell only. Everything else lives in src/ui/ud.css. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f1a; }
    body { font-family: 'Oswald', 'Arial Narrow', system-ui, sans-serif; user-select: none; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    /* Hide the screens until the stylesheet lands, or every sheet flashes
       stacked on top of each other on a cold load. The `display` on #ud-title
       MUST be scoped to .on — an unscoped ID rule (specificity 100) outranks
       .ud-screen-overlay (10) and pins the title screen open forever. */
    .ud-screen-overlay { display: none; }
    #ud-title { position: fixed; inset: 0; z-index: 40; background: #0a0f1a; }
    #ud-title.on { display: flex; align-items: flex-end; justify-content: center; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud" aria-live="polite">
    <!-- Consignment card: the company, in writing -->
    <div id="ud-consignment" class="ud-paper">
      <div class="ud-cardhead">
        <div>
          <div class="ud-label" data-i18n="hud.consignment">CONSIGNMENT</div>
          <div id="ud-pkg-name" data-i18n="hud.nopackage">NO CONSIGNMENT</div>
        </div>
        <div id="ud-mark"></div>
      </div>
      <div id="ud-pkg-note" data-i18n="hud.nopackage.note">Collect at the depot chute.</div>
      <div id="ud-stack" class="ud-label"></div>

      <div class="ud-meter" id="ud-meter-condition" data-state="ok" hidden>
        <div class="ud-meter-head">
          <span class="ud-label" data-i18n="hud.condition">CONDITION</span>
          <span class="ud-meter-val">100%</span>
        </div>
        <div class="ud-ticks"></div>
      </div>
      <div class="ud-meter" id="ud-meter-shake" data-state="ok" hidden>
        <div class="ud-meter-head">
          <span class="ud-label" data-i18n="hud.instability">INSTABILITY</span>
          <span class="ud-meter-val">0%</span>
        </div>
        <div class="ud-ticks"></div>
      </div>
    </div>

    <!-- Navigation: the courier's handheld, live -->
    <div id="ud-nav" class="ud-screen">
      <span id="ud-nav-label" class="ud-label" data-i18n="hud.deliverto">DELIVER TO</span>
      <div id="ud-nav-row">
        <span id="ud-arrow">➤</span>
        <span id="ud-dist" class="ud-num">--</span>
      </div>
      <div id="ud-timer"></div>
    </div>

    <div id="ud-revenue" class="ud-screen">
      <div class="ud-label" data-i18n="hud.revenue">REVENUE</div>
      <div id="ud-score" class="ud-num">0</div>
      <div id="ud-deliveries">0</div>
      <div id="ud-alt">ALT 0 m</div>
      <div id="ud-shift" class="ud-label"></div>
      <div id="ud-chain"></div>
    </div>

    <div id="ud-pops"></div>
    <div id="ud-banner" role="alert"></div>
    <div id="ud-toasts"></div>

    <!-- Waybill -->
    <div id="ud-waybill" class="ud-paper ud-perf">
      <div class="ud-wb-head">
        <div>
          <div class="ud-wb-title" data-i18n="hud.waybill">WAYBILL</div>
          <div id="ud-wb-no">No. 000</div>
        </div>
        <div class="ud-wb-mark"></div>
      </div>
      <div class="ud-field">
        <div class="ud-label" data-i18n="hud.consignment">CONSIGNMENT</div>
        <div class="ud-field-val" id="ud-wb-item"></div>
      </div>
      <div class="ud-field">
        <div class="ud-label" data-i18n="hud.consignee">CONSIGNEE</div>
        <div class="ud-field-val" id="ud-wb-to"></div>
      </div>
      <div id="ud-wb-warning"></div>
      <div id="ud-barcode"></div>
      <div id="ud-wb-track"></div>
    </div>

    <div id="ud-hint" class="ud-screen" data-i18n-html="hint.controls"></div>
    <div id="ud-lockhint" class="ud-screen" data-i18n="hud.lockhint"></div>
    <div id="ud-status"></div>
  </div>

  <!-- Screens are SIBLINGS of #hud so hud.show() can never orphan them. -->
  <div id="ud-title" class="ud-screen-overlay on">
    <div class="ud-title-inner">
      <div class="ud-wordmark">VPS</div>
      <div class="ud-wordmark-sub" data-i18n="brand.full">Vertical Parcel Service</div>
      <div id="ud-title-tagline" data-i18n="brand.tagline">UPHILL. ON TIME. MOSTLY.</div>
      <div id="ud-title-loading" data-i18n="title.loading">Loading the mountain…</div>
      <div id="ud-title-bar"><i></i></div>
      <div id="ud-title-start" data-i18n="title.start" hidden>CLICK TO START YOUR SHIFT</div>
      <div id="ud-title-controls" data-i18n-html="title.controls" hidden></div>
      <div id="ud-title-blurb" data-i18n="title.blurb" hidden></div>
      <div class="ud-btnrow" id="ud-title-actions" style="justify-content:center" hidden></div>
    </div>
  </div>

  <div id="ud-briefing" class="ud-screen-overlay"><div class="ud-sheet"></div></div>
  <div id="ud-pause" class="ud-screen-overlay"><div class="ud-sheet"></div></div>
  <div id="ud-results" class="ud-screen-overlay"><div class="ud-sheet"></div></div>
  <div id="ud-meta" class="ud-screen-overlay"><div class="ud-sheet"></div></div>
  <div id="ud-fault" class="ud-screen-overlay"><div class="ud-sheet"></div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
